# Ejemplo para una WLAN de laboratorio. En produccion, limitar listener a la
# interfaz WLAN concreta y configurar TLS/ACL segun la red autorizada.
listener 1883 0.0.0.0
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl
persistence true
autosave_interval 60
log_dest syslog
