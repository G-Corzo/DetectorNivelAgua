<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Formula del indice de riesgo de evaporacion</title>
  <desc id="desc">Infografia del indice de riesgo de evaporacion usado en el prototipo IoT.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f7ff"/>
      <stop offset="45%" stop-color="#f6fbf7"/>
      <stop offset="100%" stop-color="#fff6d8"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f6f9a"/>
      <stop offset="100%" stop-color="#42b8d7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0c2a3a" flood-opacity="0.18"/>
    </filter>
    <style>
      .title { font: 800 56px Arial, sans-serif; fill: #102733; }
      .subtitle { font: 400 27px Arial, sans-serif; fill: #35515e; }
      .label { font: 700 26px Arial, sans-serif; fill: #12313f; }
      .small { font: 400 22px Arial, sans-serif; fill: #3d5661; }
      .formula { font: 800 48px Arial, sans-serif; fill: #0b3343; }
      .weight { font: 800 38px Arial, sans-serif; fill: #ffffff; }
      .card-title { font: 800 28px Arial, sans-serif; fill: #102733; }
      .card-text { font: 400 22px Arial, sans-serif; fill: #39545f; }
      .chip { font: 800 24px Arial, sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <path d="M0 790 C220 730 360 850 560 805 C760 760 920 700 1135 750 C1325 795 1450 745 1600 695 L1600 1000 L0 1000 Z" fill="url(#water)" opacity="0.92"/>
  <path d="M0 840 C220 805 380 900 610 845 C800 800 1000 780 1190 820 C1380 860 1490 830 1600 795" fill="none" stroke="#bceffc" stroke-width="7" opacity="0.75"/>

  <circle cx="1400" cy="150" r="76" fill="#ffd44d"/>
  <g stroke="#ffd44d" stroke-width="14" stroke-linecap="round">
    <line x1="1400" y1="35" x2="1400" y2="0"/>
    <line x1="1400" y1="300" x2="1400" y2="265"/>
    <line x1="1285" y1="150" x2="1250" y2="150"/>
    <line x1="1550" y1="150" x2="1515" y2="150"/>
    <line x1="1318" y1="68" x2="1292" y2="42"/>
    <line x1="1482" y1="232" x2="1508" y2="258"/>
    <line x1="1482" y1="68" x2="1508" y2="42"/>
    <line x1="1318" y1="232" x2="1292" y2="258"/>
  </g>

  <text x="80" y="90" class="title">Indice de riesgo de evaporacion</text>
  <text x="82" y="135" class="subtitle">Modelo simplificado para fusionar variables ambientales en el prototipo IoT</text>

  <rect x="80" y="185" width="1440" height="180" rx="28" fill="#ffffff" filter="url(#shadow)" opacity="0.98"/>
  <text x="145" y="295" class="formula">R = 0.35 Tn + 0.30 AS + 0.25 RS + 0.10 PB</text>
  <text x="145" y="335" class="small">R se expresa de 0 a 100. A mayor valor, mayor riesgo de evaporacion y sequia local.</text>

  <g filter="url(#shadow)">
    <rect x="80" y="420" width="330" height="250" rx="24" fill="#e94d35"/>
    <circle cx="138" cy="486" r="32" fill="#ffffff" opacity="0.22"/>
    <text x="122" y="497" class="weight">35%</text>
    <text x="120" y="560" class="card-title" fill="#ffffff">Temperatura</text>
    <text x="120" y="602" class="card-text" fill="#ffffff">Tn = temperatura</text>
    <text x="120" y="633" class="card-text" fill="#ffffff">normalizada</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="450" y="420" width="330" height="250" rx="24" fill="#2f8fbc"/>
    <circle cx="508" cy="486" r="32" fill="#ffffff" opacity="0.22"/>
    <text x="492" y="497" class="weight">30%</text>
    <text x="490" y="560" class="card-title" fill="#ffffff">Aire seco</text>
    <text x="490" y="602" class="card-text" fill="#ffffff">AS = 100 - humedad</text>
    <text x="490" y="633" class="card-text" fill="#ffffff">relativa (%)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="820" y="420" width="330" height="250" rx="24" fill="#f2a51f"/>
    <circle cx="878" cy="486" r="32" fill="#ffffff" opacity="0.22"/>
    <text x="862" y="497" class="weight">25%</text>
    <text x="860" y="560" class="card-title" fill="#ffffff">Radiacion solar</text>
    <text x="860" y="602" class="card-text" fill="#ffffff">RS = lectura del LDR</text>
    <text x="860" y="633" class="card-text" fill="#ffffff">normalizada (%)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1190" y="420" width="330" height="250" rx="24" fill="#5666a9"/>
    <circle cx="1248" cy="486" r="32" fill="#ffffff" opacity="0.22"/>
    <text x="1232" y="497" class="weight">10%</text>
    <text x="1230" y="560" class="card-title" fill="#ffffff">Baja presion</text>
    <text x="1230" y="602" class="card-text" fill="#ffffff">PB = caida frente a</text>
    <text x="1230" y="633" class="card-text" fill="#ffffff">1013.25 hPa</text>
  </g>

  <rect x="110" y="735" width="1380" height="145" rx="26" fill="#ffffff" opacity="0.95" filter="url(#shadow)"/>
  <text x="150" y="790" class="label">Interpretacion para las alertas</text>
  <text x="150" y="835" class="small">Normal: nivel suficiente y R menor a 55.  Alerta: nivel medio/bajo o R mayor o igual a 55.</text>
  <text x="150" y="870" class="small">Critico: nivel menor a 30% y R mayor o igual a 70. La formula es un indice de riesgo, no mm/dia.</text>

  <rect x="1125" y="74" width="250" height="52" rx="26" fill="#0c5c75"/>
  <text x="1160" y="108" class="chip">Challenge 2 IoT</text>
</svg>
